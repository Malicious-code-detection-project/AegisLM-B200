training:
  common:
    sequence_len: 2048
    seed: 20260728
    micro_batch_size: 1
    gradient_accumulation_steps: 1
    max_steps: 1
    lora_rank: 8
    lora_alpha: 16
    lora_dropout: 0.0
    expert_lora: true
    lora_target_modules: 'model.language_model.layers.[\d]+.(mlp|cross_attn|self_attn).(up|down|gate|q|k|v|o)_proj'
